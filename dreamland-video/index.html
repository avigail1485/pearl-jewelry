<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ארץ החלומות — תצוגה חיה</title>
<style>
  :root { --bg: #12031f; --fg: #fff7ee; --acc: #ff3e9b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  #stage { width: min(100%, calc((100vh - 120px) * 16 / 9)); aspect-ratio: 16 / 9; position: relative; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 8px; box-shadow: 0 10px 60px #0008; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; background: #0007; border: 0; color: var(--fg);
           font-size: clamp(18px, 3vw, 36px); cursor: pointer; border-radius: 8px; }
  .bar { width: min(100%, calc((100vh - 120px) * 16 / 9)); display: flex; gap: 12px; align-items: center; direction: ltr; }
  button { background: var(--acc); color: #fff; border: 0; border-radius: 999px; padding: 8px 18px; font-size: 15px; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid #fff4; }
  input[type=range] { flex: 1; accent-color: var(--acc); }
  #time { font: 14px ui-monospace, monospace; min-width: 170px; }
  #qa { font: 12px ui-monospace, monospace; color: #ffb36b; min-height: 1em; direction: rtl; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="cv" width="1920" height="1080"></canvas>
    <button id="start">▶ לחצו לניגון עם סאונד</button>
  </div>
  <div class="bar">
    <button id="play">▶</button>
    <input id="seek" type="range" min="0" max="101.17" step="0.0333" value="0">
    <span id="time">00:00.00 · #0000</span>
    <button class="ghost" id="grid" title="G">גריד</button>
  </div>
  <div id="qa"></div>
  <audio id="au" src="assets/music.mp3" preload="auto"></audio>
<script src="engine.js"></script>
<script>
  const cv = document.getElementById('cv'), au = document.getElementById('au');
  const seek = document.getElementById('seek'), timeEl = document.getElementById('time'), qaEl = document.getElementById('qa');
  const playBtn = document.getElementById('play'), startBtn = document.getElementById('start');
  let grid = false, scrubT = 0;
  const fmt = t => { const m = Math.floor(t / 60), s = (t % 60).toFixed(2).padStart(5, '0'); return `0${m}:${s}`; };
  function toggle() { if (au.paused) { au.play(); startBtn.style.display = 'none'; } else au.pause(); }
  DREAM.init(cv).then(() => {
    playBtn.onclick = startBtn.onclick = toggle;
    au.onplay = () => (playBtn.textContent = '❚❚'); au.onpause = () => (playBtn.textContent = '▶');
    seek.oninput = () => { au.currentTime = scrubT = +seek.value; };
    document.getElementById('grid').onclick = () => DREAM.setGrid(grid = !grid);
    addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); toggle(); }
      if (e.key === 'g' || e.key === 'G') DREAM.setGrid(grid = !grid);
      if (e.key === 'ArrowRight') au.currentTime = Math.min(DREAM.DUR, au.currentTime + 1 / 30);
      if (e.key === 'ArrowLeft') au.currentTime = Math.max(0, au.currentTime - 1 / 30);
    });
    (function loop() {
      const t = au.currentTime;
      DREAM.render(t);
      if (!au.paused) seek.value = t;
      timeEl.textContent = `${fmt(t)} · #${String(Math.round(t * 30)).padStart(4, '0')}`;
      requestAnimationFrame(loop);
    })();
  });
</script>
</body>
</html>
