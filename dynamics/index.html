<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DYNAMICS | מיתוג, קריאייטיב, פרסום, קופי ואתרים</title>
  <meta name="description" content="סטודיו DYNAMICS. זהות מותג, קריאייטיב, פרסום, קופי, ובנייה ועיצוב של אתרים. בואו לנסוע." />
  <meta name="theme-color" content="#1D1D1B" />
  <link rel="icon" href="/assets/brand/logo-c-mark.svg" type="image/svg+xml" />
  <link rel="preload" href="/assets/fonts/TelAvivBrutalist-Bold.ttf" as="font" type="font/ttf" crossorigin />
</head>
<body>
  <header class="site-header grid">
    <a class="site-logo" href="/" aria-label="DYNAMICS, דף הבית">
      <img src="/assets/brand/logo-on-dark.svg" alt="DYNAMICS" width="292" height="32" />
    </a>
  </header>

  <main id="main">
    <!-- פתיחה: DOM ולא WebGL. הטקסט מופיע מיד, השדה נטען מעליו. -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="brand-field" aria-hidden="true"></div>
      <div class="hero-car" aria-hidden="true"></div>
      <div class="hero__copy grid">
        <h1 id="hero-title" class="hero__title t-h1">אף מותג לא ניצח מהחניה.</h1>
        <p class="hero__domains t-sub"><span>מיתוג.</span> <span>קריאייטיב.</span> <span>פרסום.</span> <span>קופי.</span> <span>אתרים.</span></p>
        <p class="hero__hint t-hud">גללו. זה הגז.</p>
      </div>
    </section>

    <section class="band" aria-label="מיתוג. קריאייטיב. פרסום. קופי. אתרים.">
      <div class="marquee" data-marquee="1">
        <div class="marquee__track">
          <span class="marquee__item t-mega">מיתוג<i class="marquee__c"></i>קריאייטיב<i class="marquee__c"></i>פרסום<i class="marquee__c"></i>קופי<i class="marquee__c"></i>אתרים<i class="marquee__c"></i></span>
        </div>
      </div>
      <div class="marquee marquee--outline" data-marquee="-1" aria-hidden="true">
        <div class="marquee__track">
          <span class="marquee__item t-mega">מיתוג<i class="marquee__c"></i>קריאייטיב<i class="marquee__c"></i>פרסום<i class="marquee__c"></i>קופי<i class="marquee__c"></i>אתרים<i class="marquee__c"></i></span>
        </div>
      </div>
    </section>

    <section class="statement grid" aria-label="חמישה אורות. חמישה עולמות.">
      <p class="statement__text t-h1" data-statement>חמישה אורות. <em>חמישה עולמות.</em></p>
    </section>
  </main>

  <a class="contact-fab t-small" href="/contact/">יצירת קשר</a>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
